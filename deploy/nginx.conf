map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

limit_req_zone $client_ip zone=site:10m rate=10r/s;
limit_req_zone $client_ip zone=admin_login:10m rate=5r/m;

server {
    listen 80;
    client_max_body_size 21m;
    limit_req_status 429;
    limit_req zone=site burst=30 nodelay;

    location = /api/admin/login {
        limit_req zone=admin_login burst=2 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
